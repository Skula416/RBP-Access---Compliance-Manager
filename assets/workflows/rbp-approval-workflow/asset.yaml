apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: rbp-approval-workflow
  description: Orchestrates RBP permission change approvals via SAP Task Center, auto-applies approved changes in SAP SuccessFactors, and generates quarterly RBP compliance reports
  version: "1.0.0"
  type: n8nworkflow

projectVersion: "1"
sourceRoot: "."

workflow:
  definitionFile: rbp-approval-workflow.n8n.json
  name: rbp-approval-workflow
  ordId: sap.btpn8n:apiResource:ManagedN8nMcpServer:v1

requires:
  - name: rbp-permissions-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:rbp-access-manager-e7f14.rbp-permissions-mcp-server:v1

provides:
  apis:
    - name: rbp_recommendation_submitted
      path: /rbp-access-manager-e7f14/rbp-approval-workflow/rbp-recommendation-submitted
      kind: rest
      description: Receives an RBP permission change recommendation from the AI agent for human approval
      ordId: "sap.n8nwfrt:apiResource:rbp-access-manager-e7f14_rbp-approval-workflow.rbpRecommendationSubmitted:v1"
    - name: rbp_recommendation_submitted_mcp_server
      kind: mcp-server
      description: MCP server for RBP recommendation submitted webhook operations
      ordId: "sap.n8nwfrt:apiResource:rbp-access-manager-e7f14_rbp-approval-workflow.rbpRecommendationSubmittedMcpServer:v1"
    - name: generate_compliance_report
      path: /rbp-access-manager-e7f14/rbp-approval-workflow/generate-compliance-report
      kind: rest
      description: Triggers quarterly RBP compliance report generation and delivery
      ordId: "sap.n8nwfrt:apiResource:rbp-access-manager-e7f14_rbp-approval-workflow.generateComplianceReport:v1"
    - name: generate_compliance_report_mcp_server
      kind: mcp-server
      description: MCP server for generate compliance report webhook operations
      ordId: "sap.n8nwfrt:apiResource:rbp-access-manager-e7f14_rbp-approval-workflow.generateComplianceReportMcpServer:v1"
